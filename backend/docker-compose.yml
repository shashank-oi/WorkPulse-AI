  # WorkPulse AI backend — full stack.
  #
  #   Local dev (DB only):     docker compose up -d postgres
  #   Full deploy (app + DB):  docker compose --profile app up -d --build
  #
  # All real secrets live in .env (gitignored, never committed) — see .env.example.
  services:
    postgres:
      image: postgres:16-alpine
      container_name: workpulse-postgres
      environment:
        POSTGRES_DB: workpulse
        POSTGRES_USER: workpulse
        POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U workpulse -d workpulse"]
        interval: 2s
        timeout: 3s
        retries: 20

    backend:
      build: .
      container_name: workpulse-backend
      profiles: ["app"]
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - "8080:8080"
      env_file:
        - .env
      environment:
        SPRING_PROFILES_ACTIVE: postgres
        DB_URL: jdbc:postgresql://postgres:5432/workpulse
        DB_USER: workpulse
        DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      restart: unless-stopped

    mysql:
      image: mysql:8.4
      container_name: workpulse-mysql
      environment:
        MYSQL_DATABASE: workpulse
        MYSQL_USER: workpulse
        MYSQL_PASSWORD: workpulse
        MYSQL_ROOT_PASSWORD: root
      ports:
        - "3306:3306"
      volumes:
        - mysqldata:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uworkpulse", "-pworkpulse"]
        interval: 2s
        timeout: 3s
        retries: 20

  volumes:
    pgdata:
    mysqldata: